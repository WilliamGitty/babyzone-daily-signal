name: Daily Babyzone signal build & deploy

on:
  schedule:
    # Staggered triggers, not one: GitHub Actions' schedule trigger is
    # empirically unreliable (found live on sibling projects - a trigger
    # silently dropped, or delayed hours, especially at the top of the
    # hour when many repos schedule jobs at once). Running more than once
    # is harmless: generate.py's freshness cutoff and idempotent rebuild
    # mean a second run just regenerates the same (or newer) edition.
    - cron: "17 6 * * *"
    - cron: "47 6 * * *"
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html drafts metrics.jsonl
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Publish $(date -u +%Y-%m-%d) edition"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
