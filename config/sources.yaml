# User-Agent used for every feed fetch — several GOV.UK/trade sites block
# default/non-browser clients (confirmed live: Third Sector, LGA, IFS,
# Nursery World and CYP Now all return HTTP 403 to requests without a
# browser-like User-Agent).
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# Max items pulled from each feed per run. Kept modest since this runs
# daily (not weekly) across 8 sections — Home-Start's feed alone returned
# 948 entries in testing with no apparent per-request limit, so this cap
# matters more here than it did for Agilisys's narrower source list.
max_items_per_feed: 6

# Dropped sources — logged here per the methodology's "don't silently skip"
# instruction, not wired into feeds above:
#   - 360Giving / GrantNav: registry moved to grantnav.threesixtygiving.org,
#     which sits behind an active bot-check ("Verifying your browser",
#     HTTP 503) that blocks server-side fetches entirely. No usable public
#     API found. Worth re-checking manually in future — GrantNav's
#     underlying CKAN data is genuinely valuable (real, current UK grant-
#     making data), the blocker is purely the bot-check on this endpoint.
#   - Third Sector, Civil Society News, LGA, IFS, Nursery World, CYP Now:
#     all return HTTP 403 on direct RSS/feed fetch even with a browser
#     User-Agent — covered instead via Google News site: search above.
#   - AKO Foundation direct site (akofoundation.org): DNS resolves but the
#     connection itself times out/refuses (HTTP 000) from this environment;
#     may be geofenced or actively blocking non-browser clients. Covered
#     via Google News search instead (also imprecise — see notes above;
#     a wide when:60d window was needed just to get any real hits).
#   - City Bridge Foundation, Henry Smith Charity, National Lottery
#     Community Fund: modern JS-rendered sites with no discoverable RSS
#     feed at all. Covered via Google News search instead.
#   - Education Policy Institute (epi.org.uk/feed/), NPC/thinknpc.org
#     (thinknpc.org/feed/): both return HTTP 200 with valid, well-formed
#     but genuinely EMPTY RSS (zero <item> tags) — not a fetch failure,
#     the feed itself has no content. Covered via Google News search
#     (EPI only; NPC's name is too generic a search term to filter
#     reliably and was dropped rather than shipped noisy).
#   - Frameworks Institute: reachable (HTTP 200) but has no RSS feed and no
#     good Google News query was found that returned recent, on-topic,
#     precise results — dropped rather than shipped as a noisy source.
#   - Bare "Baby Buddy" Google News query: too generic a phrase (matches
#     unrelated obituaries, product reviews, Facebook posts) even scoped
#     to when:90d — dropped. The "digital red book" query above is the
#     verified working substitute for the Digital/Baby Buddy section.
#   - "Corporate CSR early years partnership" and "local authority
#     commissioning family services" Google News queries: both tested,
#     both returned mostly irrelevant noise or zero results — dropped.
#
# Additional sources tested live 2026-09-02 and dropped:
#   - UK Parliament committees (Education Committee, Work and Pensions
#     Committee): committees.parliament.uk publishes news.rss URLs but both
#     return HTTP 403 with a Cloudflare "Just a moment..." bot-check page,
#     with or without a browser User-Agent — blocked at the edge, not a
#     missing feed. No usable Google News substitute found either (queries
#     for the committees by name returned unrelated general education/DWP
#     news, not committee-specific activity) — dropped rather than shipped
#     imprecise.
#   - APPG on Family Hubs: no dedicated website with its own feed found
#     (appgfamilyhubs.org.uk does not resolve). A Google News query for
#     "APPG" + "family hubs" returned essentially nothing on-topic (1 hit,
#     unrelated) even at when:90d — confirms APPGs generally have no
#     monitorable feed, as flagged in the brief. Dropped.
#   - Nesta (nesta.org.uk/feed/ and variants): HTTP 404, no RSS feed
#     discoverable anywhere on the site (only a Facebook share-dialog URL
#     spuriously matches "feed" in the HTML). Dropped.
#   - 1001 Critical Days Foundation (1001criticaldays.co.uk/feed/): HTTP 404
#     (redirects to 301 then a broken feed path). No RSS feed found. Dropped.
#   - Royal Foundation Centre for Early Childhood
#     (centreforearlychildhood.org/feed/): resolves but redirects (301) back
#     to the plain homepage rather than serving a feed — no real RSS feed
#     exists. Dropped.
#   - LGA (local.gov.uk) Google News fallback, same site: technique used
#     for Third Sector/Civil Society News: tested at both q=site:local.gov.uk
#     and a tighter "early years"-scoped variant — both return generic
#     evergreen listing-page titles ("News - local.gov.uk", "Case studies -
#     local.gov.uk", "Publications - local.gov.uk") rather than real dated
#     articles, even with when:7d/30d. Unlike Third Sector/Civil Society
#     News, local.gov.uk's Google indexing doesn't surface individual
#     article pages this way — dropped as noisy/non-functional, LGA remains
#     uncovered.
#   - Google News: "parental confidence" OR "parental self-efficacy" early
#     years UK: 0 results even at when:30d — dropped.
#   - Google News: "home learning environment" early years: only 3 thin,
#     largely irrelevant results at when:30d (an archive reprint, a
#     ministerial-appointment story) — dropped.
#   - Google News: perinatal mental health UK: returns real volume but
#     dominated by non-UK (US/Australia) generic postpartum-PTSD human-
#     interest pieces rather than UK policy/funding-relevant stories even
#     with "UK" in the query — dropped as too noisy for a daily feed.
#   - Google News: executive function early years child development: badly
#     noisy — genuine child-development hits interleaved with unrelated
#     watch/car-parts spam sites — dropped.
#
# Additional sources tested live 2026-09-22 (from Jonathan/Sara's
# requirements meeting source list) and dropped:
#   - Hansard written questions/answers: no working dedicated path found
#     (guessed writtenquestions.json/writtenanswers.json both 404; the API's
#     own Swagger docs page is also 404, so the real path can't be
#     confirmed without further reverse-engineering). search/debates.json
#     (used above) is the only confirmed-working Hansard endpoint —
#     written-question coverage remains a gap.
#   - committees.parliament.uk (all paths, including a specific
#     committee's own news.rss, a specific inquiry's news.rss, the bare
#     site root, and a non-RSS publications page): confirmed SITE-WIDE
#     Cloudflare block, not just the /news.rss path already noted above.
#     No workaround found.
#   - DfE grants collection (gov.uk/government/collections/dfe-grants):
#     genuine GOV.UK 404 — the slug itself doesn't exist/has been
#     renamed. A correct current slug would need manual browsing to find.
#   - Explore Education Statistics: no RSS/Atom/JSON feed discoverable
#     (JS-rendered Next.js site, guessed /api/publications also 404s).
#   - ONS releases RSS: the documented releasecalendar?query=X&rss pattern
#     returns HTTP 200 but the query= param is SILENTLY IGNORED (three
#     different queries returned byte-identical generic results) — same
#     "looks like it filters but doesn't" trap as GOV.UK's order= param
#     noted above. Not usable without client-side filtering — dropped.
#   - Early Years Alliance, LGA, Education Endowment Foundation: all
#     HTTP 403 Cloudflare block, including their bare homepages.
#   - IFS: HTTP 403 Cloudflare block — confirms the existing note above.
#   - Coram Family and Childcare (familyandchildcaretrust.org): TCP
#     connection itself times out on every path, including the homepage —
#     same failure mode as AKO Foundation above (likely geofenced).
#   - Action for Children, NSPCC, NCB, CPAG, Barnardo's, The Children's
#     Society, Save the Children UK, Institute for Government: no RSS
#     feed discoverable at common paths or via homepage <link> tags
#     (NSPCC and NCB specifically 403 site-wide via Cloudflare; the rest
#     404 cleanly with no feed link found).
#   - Policy Exchange (policyexchange.org.uk/feed): HTTP 200, well-formed,
#     but effectively abandoned — only 2 items, dated 2020 and 2015.
#   - Demos (demos.co.uk/feed): HTTP 200, well-formed, current
#     lastBuildDate, but genuinely EMPTY (0 items) — same pattern as
#     EPI/NPC above.
#   - TES (tes.com/magazine/rss): HTTP 200, well-formed feed shape, but
#     genuinely EMPTY at time of testing. Not wired in as-is since it
#     would contribute zero items, but worth a periodic re-check since
#     the endpoint itself is real (unlike the other 404s above).
