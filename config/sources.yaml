  # --- Comparable/adjacent organisations (place-based expansion signal) ---
  - name: "OnSide Youth Zones"
    url: https://www.onsideyouthzones.org/feed/
    section_hint: expansion
  - name: "Home-Start UK"
    url: "https://www.home-start.org.uk/handlers/rss.ashx?feed=1"
    section_hint: partner

  # --- Google News RSS search — proven fallback for sources that block
  # direct fetches (Third Sector, Civil Society News, Nursery World, CYP
  # Now, LGA, IFS, EPI, NPC, AKO Foundation, Henry Smith, City Bridge
  # Foundation, National Lottery Community Fund all 403/404/empty-feed on
  # direct fetch — verified live) or have no feed at all. Every query below
  # was tested live and kept only if it returned genuinely on-topic UK
  # results; several tested queries were dropped for returning noise or
  # zero results even with a wide when: window (see build session notes) —
  # notably a bare "Baby Buddy" query, "corporate CSR early years
  # partnership", and "local authority commissioning family services" all
  # returned mostly irrelevant results and were cut rather than shipped.
  #
  # `when:Xd` forces genuinely recent results (Google ranks by relevance,
  # not date, by default — a plain query can return zero items inside a
  # tight freshness window even with 20+ entries, verified live for several
  # queries below). Freshness windows here are set wide enough that Google
  # doesn't itself return zero; the real recency filtering happens
  # mechanically downstream via FEED_LOOKBACK_HOURS, same pattern as the
  # GOV.UK search API above.
  - name: "Google News: Third Sector"
    url: "https://news.google.com/rss/search?q=site:thirdsector.co.uk+when:3d&hl=en-GB&gl=GB&ceid=GB:en"
    section_hint: behind_headlines
  - name: "Google News: Civil Society News"
    url: "https://news.google.com/rss/search?q=site:civilsociety.co.uk+when:3d&hl=en-GB&gl=GB&ceid=GB:en"
    section_hint: behind_headlines
  - name: "Google News: Nursery World"
