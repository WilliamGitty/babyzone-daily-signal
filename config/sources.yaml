    section_hint: funding
  - name: "Nuffield Foundation"
    url: https://www.nuffieldfoundation.org/feed
    section_hint: research
  - name: "Resolution Foundation"
    url: https://www.resolutionfoundation.org/feed/
    section_hint: research
  - name: "Joseph Rowntree Foundation"
    url: https://www.jrf.org.uk/rss.xml
    section_hint: research

  # --- Think tanks / research bodies with working direct feeds ---
