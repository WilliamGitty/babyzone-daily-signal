# RSS/Atom feeds fetched directly by generate.py (no AI judgment involved in fetching).
# Every source below was live-tested (curl + feedparser) on 2026-09-02 before being
# added — see the build session notes for the full list of what was tried and dropped
# (Third Sector, Civil Society News, LGA, IFS, Nursery World, CYP Now, AKO Foundation,
# Henry Smith, City Bridge Foundation, National Lottery Community Fund, EPI, NPC, and
# GrantNav all block direct fetches or publish empty/broken feeds — covered instead via
# Google News RSS search below, verified live the same way).
#
# To add a feed: add an entry here and push — no code change needed, next scheduled
# run picks it up automatically.

feeds:
  # --- GOV.UK department Atom feeds (all verified live, 20 entries each) ---
  - name: DfE
    url: https://www.gov.uk/government/organisations/department-for-education.atom
    section_hint: policy
  - name: DWP
    url: https://www.gov.uk/government/organisations/department-for-work-pensions.atom
    section_hint: policy
  - name: MHCLG
    url: https://www.gov.uk/government/organisations/ministry-of-housing-communities-local-government.atom
    section_hint: policy
  - name: Cabinet Office
    url: https://www.gov.uk/government/organisations/cabinet-office.atom
    section_hint: policy
  - name: "Government Office for Science"
    url: https://www.gov.uk/government/organisations/government-office-for-science.atom
    section_hint: research

  # --- GOV.UK official Search API, verified live (q= genuinely filters
  # server-side; order=-public_timestamp was tested and found to SILENTLY
  # BREAK the q= filter entirely — same "parameter looks like it should
  # combine but doesn't" trap the Agilisys build hit with Contracts
  # Finder's keyword param. Do not add &order= to these. Relevance-ranked
  # results include a long tail of old evergreen guidance pages; the
  # mechanical Python-side FEED_LOOKBACK_HOURS cutoff (via public_timestamp)
  # handles recency instead, same pattern as Google News' when: trick below. ---
  - name: "GOV.UK search: family hubs"
    url: "https://www.gov.uk/api/search.json?q=family+hubs&count=20"
    type: govuk_search
    section_hint: policy
  - name: "GOV.UK search: early years"
    url: "https://www.gov.uk/api/search.json?q=early+years&count=20"
    type: govuk_search
    section_hint: policy
  - name: "GOV.UK search: child poverty strategy"
    url: "https://www.gov.uk/api/search.json?q=child+poverty+strategy&count=20"
    type: govuk_search
    section_hint: policy
  - name: "GOV.UK search: school readiness"
    url: "https://www.gov.uk/api/search.json?q=school+readiness&count=20"
    type: govuk_search
    section_hint: policy

  # --- Find a Grant (find-government-grants.service.gov.uk) — verified live.
  # searchTerm genuinely filters server-side (0 results for a nonsense
  # query, 10 for a real one — checked, unlike GOV.UK's broken keywords=
  # param above). NOTE: this uses an undocumented internal Next.js
  # "_next/data/<build-id>/grants.json" route, not a published public API.
  # The build id changes on their next deploy and the URL below WILL start
  # 404ing at that point — confirmed live that a wrong build id fails
  # cleanly with a 404 (not silent garbage), so this shows up as a normal
  # "failed" source in metrics/logs rather than corrupting output. Needs
  # periodic manual re-verification of the build id (visible in any
  # find-government-grants.service.gov.uk page's <script src> paths). ---
  - name: "Find a Grant: early years"
    url: "https://find-government-grants.service.gov.uk/_next/data/FTWhBBOb5sBs97tTvdHHP/grants.json?searchTerm=early+years"
    type: find_a_grant
    section_hint: funding
  - name: "Find a Grant: children and families"
    url: "https://find-government-grants.service.gov.uk/_next/data/FTWhBBOb5sBs97tTvdHHP/grants.json?searchTerm=children+and+families"
    type: find_a_grant
    section_hint: funding

